name: oidcmulti
on:
  workflow_dispatch:
    inputs:
      roles:
        description: comma-separated role arns
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - name: run
        run: |
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$IDT" | jq -r .value)
          echo "=== TOKEN_SUB ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r .sub
          IFS=',' read -ra ARR <<< "${{ github.event.inputs.roles }}"
          for R in "${ARR[@]}"; do
            echo "########## ROLE=$R"
            if ! aws sts assume-role-with-web-identity --role-arn "$R" --role-session-name ghoidc --web-identity-token "$TOKEN" --duration-seconds 3600 --region us-east-1 --output json 2>&1; then :; fi
          done
