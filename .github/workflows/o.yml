name: oidc
on: push
permissions:
  id-token: write
  contents: read
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - name: run
        run: |
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$IDT" > /tmp/idt.json
          TOKEN=$(jq -r .value /tmp/idt.json)
          echo "CLAIMS_B64=$(echo $TOKEN | cut -d. -f2)"
          echo "ASSUME_OUT:"
          aws sts assume-role-with-web-identity --role-arn arn:aws:iam::301142909784:role/github-actions-danoguer-dev-role --role-session-name ghoidc --web-identity-token "$TOKEN" --duration-seconds 900 --region us-east-1 --output json
